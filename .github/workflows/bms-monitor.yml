name: BookMyShow Monitor

on:
  schedule:
    # Every 15 minutes. GitHub may delay by a few minutes; this is normal.
    - cron: '*/15 * * * *'
  workflow_dispatch:   # Manual trigger from the Actions tab

concurrency:
  group: bms-monitor
  cancel-in-progress: false   # never cancel a running check mid-flight

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit state.json back to monitor-state branch

    steps:
      # ── 1. Code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tzdata (for ZoneInfo on Linux)
        run: pip install tzdata

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 3. Restore persistent state ──────────────────────────────────
      - name: Restore state from monitor-state branch
        run: |
          git fetch origin monitor-state:monitor-state 2>/dev/null || true
          git checkout monitor-state -- state/state.json 2>/dev/null \
            || echo "No previous state found — starting fresh."
        continue-on-error: true

      # ── 4. Run the monitor ───────────────────────────────────────────
      - name: Run BookMyShow Monitor
        env:
          BMS_EMAIL_SENDER:        ${{ secrets.BMS_EMAIL_SENDER }}
          BMS_EMAIL_RECIPIENTS:    ${{ secrets.BMS_EMAIL_RECIPIENTS }}
          BMS_GMAIL_APP_PASSWORD:  ${{ secrets.BMS_GMAIL_APP_PASSWORD }}
          BMS_NTFY_TOPIC_ALERT:    ${{ secrets.BMS_NTFY_TOPIC_ALERT }}
          BMS_NTFY_TOPIC_HEARTBEAT: ${{ secrets.BMS_NTFY_TOPIC_HEARTBEAT }}
          BMS_NTFY_TOKEN:          ${{ secrets.BMS_NTFY_TOKEN }}
          BMS_STATE_FILE:          "state/state.json"
          BMS_TIMEZONE:            "Asia/Kolkata"
        run: python main.py

      # ── 5. Persist updated state ─────────────────────────────────────
      - name: Commit state to monitor-state branch
        if: always()   # run even when the monitor exits with 0 (no shows found)
        run: |
          if [ ! -f state/state.json ]; then
            echo "No state file to commit."
            exit 0
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the state file, switch to monitor-state, apply it back.
          git stash push --include-untracked -- state/state.json

          git checkout monitor-state 2>/dev/null \
            || git checkout -b monitor-state

          git checkout stash -- state/state.json 2>/dev/null \
            || git checkout stash -- .

          git add state/state.json

          if git diff --cached --quiet; then
            echo "State unchanged — nothing to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            git push origin monitor-state
            echo "State committed and pushed."
          fi
